<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam Optimizer Points</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <style>
        main {
            width: min(1180px, calc(100% - 32px));
        }

        .layout {
            grid-template-columns: 1fr;
        }

        .action-row {
            display: grid;
            gap: 10px;
            margin-top: 18px;
        }

        .primary-button,
        .secondary-button {
            min-height: 44px;
            border-radius: 12px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .primary-button {
            border: 1px solid #1d4ed8;
            background: #2563eb;
            color: #fff;
        }

        .primary-button:hover {
            background: #1d4ed8;
        }

        .secondary-button {
            border: 1px solid rgba(148, 163, 184, 0.45);
            background: #fff;
            color: var(--text);
        }

        .secondary-button:hover {
            border-color: rgba(37, 99, 235, 0.45);
            background: rgba(239, 246, 255, 0.8);
        }

        .metric-grid {
            display: grid;
            gap: 10px;
            margin: 0;
        }

        .metric-item {
            display: grid;
            gap: 4px;
            padding: 10px 12px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            background: rgba(248, 250, 252, 0.86);
        }

        .metric-item dt {
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 700;
        }

        .metric-item dd {
            margin: 0;
            font-family: "SF Mono", "Consolas", monospace;
            font-size: 0.88rem;
        }

        .canvas-panel canvas {
            max-width: 760px;
        }

        @media (min-width: 980px) {
            .layout {
                grid-template-columns: 220px minmax(0, 1fr) 300px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="../dist/adam-optimizer-points/main.js"></script>
</body>
</html>
