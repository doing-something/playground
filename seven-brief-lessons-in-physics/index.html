<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Seven Brief Lessons on Physics — Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --copper:#c98a4b;
    --copper-bright:#e8b477;
    --ink:#0a0908;
    --text:#d8cfc4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--ink)}
  body{font-family:Georgia,'Noto Serif KR','Times New Roman',serif;color:var(--text)}
  canvas{position:fixed;inset:0;display:block;touch-action:none}

  #brand{
    position:fixed;top:26px;left:0;right:0;text-align:center;
    font-size:11px;letter-spacing:.38em;color:var(--copper);
    opacity:.75;pointer-events:none;text-transform:uppercase;
  }

  /* cover title */
  #cover-title{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    pointer-events:none;transition:opacity .8s;
  }
  #cover-title h1, #cover-title .author{
    font-family:'Futura','Avenir Next','Century Gothic',Verdana,sans-serif;
    font-weight:400;color:#eceae6;text-transform:uppercase;
  }
  #cover-title h1{
    font-size:clamp(30px,4.6vw,58px);line-height:1.5;letter-spacing:.2em;
  }
  #cover-title .author{
    font-size:clamp(20px,2.9vw,36px);line-height:1.5;letter-spacing:.22em;margin-top:44px;
  }
  #cover-title .post{font-size:13px;color:#8f867b;margin-top:38px;letter-spacing:.12em;font-family:Georgia,serif}
  #cover-title .go{font-size:12px;color:var(--copper);margin-top:46px;letter-spacing:.3em;animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* lesson info */
  #info{
    position:fixed;left:48px;bottom:64px;max-width:520px;
    pointer-events:none;transition:opacity .8s;
  }
  #info #num{font-size:11px;letter-spacing:.4em;color:var(--copper);margin-bottom:12px;text-transform:uppercase}
  #info h1{font-size:clamp(22px,3.2vw,36px);font-weight:400;letter-spacing:.06em;color:#efe6da;line-height:1.25}
  #info #sub{font-size:14px;color:#a89c8e;margin-top:12px;line-height:1.7}
  #info #hint{font-size:12px;color:var(--copper);margin-top:16px;letter-spacing:.08em;opacity:.85}
  #info #hint::before{content:'✦ ';opacity:.7}

  .navbtn{
    position:fixed;top:50%;transform:translateY(-50%);
    width:46px;height:46px;border-radius:50%;
    background:transparent;border:1px solid rgba(201,138,75,.35);
    color:var(--copper);font-size:18px;cursor:pointer;
    font-family:Georgia,serif;transition:all .3s;z-index:5;
  }
  .navbtn:hover{background:rgba(201,138,75,.12);border-color:var(--copper)}
  #prev{left:22px}#next{right:22px}
  .navbtn:disabled{opacity:.15;cursor:default}

  #dots{
    position:fixed;bottom:26px;left:0;right:0;display:flex;
    justify-content:center;gap:14px;z-index:5;
  }
  #dots button{
    width:8px;height:8px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(201,138,75,.28);transition:all .3s;padding:0;
  }
  #dots button.on{background:var(--copper-bright);transform:scale(1.45);box-shadow:0 0 8px rgba(232,180,119,.6)}

  @media (max-width:640px){
    #info{left:24px;right:24px;bottom:80px}
    #prev{left:8px}#next{right:8px}
    #brand{font-size:9px;letter-spacing:.25em;padding:0 20px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="brand">Seven Brief Lessons on Physics · Carlo Rovelli</div>

<div id="cover-title">
  <h1>SEVEN BRIEF<br>LESSONS<br>ON PHYSICS</h1>
  <p class="author">CARLO<br>ROVELLI</p>
  <p class="post">모든 것은 입자다 — 일곱 개의 짧은 물리학 강의</p>
  <p class="go">CLICK → TO BEGIN</p>
</div>

<div id="info">
  <div id="num"></div>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <p id="hint"></p>
</div>

<button class="navbtn" id="prev" aria-label="previous">←</button>
<button class="navbtn" id="next" aria-label="next">→</button>
<div id="dots"></div>
<script type="module" src="../dist/seven-brief-lessons-in-physics/main.js"></script>
</body>
</html>
